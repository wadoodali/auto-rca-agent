name: Semantic Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic_evaluation:
    name: Semantic Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate semantic evaluation credentials
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required for semantic evaluation."
            exit 1
          fi
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is required for semantic evaluation."
            exit 1
          fi

      - name: Seed ChromaDB
        run: python scripts/seed_samples.py

      - name: Run semantic evaluation
        run: python -m pytest tests/evaluation/semantic -q
