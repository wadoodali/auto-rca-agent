services:
  chroma_seed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
    command: ["python", "scripts/seed_samples.py"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      chroma_seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  chroma_data:
